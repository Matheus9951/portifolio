apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# Aumentar replicas em prod
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: meu-app

# Imagem atualizada pelo pipeline CI/CD
images:
  - name: app
    newName: 123456789.dkr.ecr.us-east-1.amazonaws.com/meu-app
    newTag: latest

commonLabels:
  env: prod
