# ============================================================
# ServiceAccount para pipelines CI/CD (GitHub Actions / ArgoCD)
# Permissão mínima: apenas deploy de imagens
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: production
  annotations:
    # IRSA — associa a uma IAM Role para acesso ao ECR
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ci-deployer-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: production
rules:
  # Apenas atualizar imagens em deployments existentes
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch", "update"]
  # Verificar status dos rollouts
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Ver pods para aguardar readiness
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: production
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
